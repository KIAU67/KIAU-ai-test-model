<!doctype html>
<html lang="id" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090B">
<title>KIAU AI</title>
<link id="fav" rel="icon">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<style>
:root{--bg:#FAFAFB;--sf:#fff;--s2:#F4F4F5;--ln:#E4E4E7;--fg:#18181B;--mu:#71717A;--pr:#4F46E5;--ps:#4F46E5;--dg:#DC2626}
.dark{--bg:#09090B;--sf:#121214;--s2:#18181B;--ln:#27272A;--fg:#FAFAFA;--mu:#A1A1AA;--pr:#6366F1;--ps:#A78BFA;--dg:#F87171}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
html,body{height:100%}
body{font:15px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:16px;height:16px;display:block;flex:none}
:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--pr) 35%,transparent)}
*{scrollbar-width:thin;scrollbar-color:var(--ln) transparent}
#app{display:flex;height:100dvh;overflow:hidden}
#side{width:280px;flex:none;background:var(--sf);border-right:1px solid var(--ln);display:flex;flex-direction:column;transition:margin .25s}
.collapsed #side{margin-left:-280px}
main{flex:1;min-width:0;display:flex;flex-direction:column}
#scrim{display:none}
@media(max-width:767px){#side{position:fixed;inset:0 auto 0 0;z-index:40;width:84%;max-width:320px;transform:translateX(-100%);transition:transform .25s;margin:0!important}.open #side{transform:none}.open #scrim{display:block;position:fixed;inset:0;background:#0009;backdrop-filter:blur(4px);z-index:30}}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;font-size:17px}
.lg{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:28%;background:#000;overflow:hidden;box-shadow:0 0 0 1px #ffffff1a;flex:none}.lg img{width:100%;height:100%;object-fit:contain}
.top{padding:0 12px;display:grid;gap:8px}
#new{display:flex;align-items:center;justify-content:center;gap:8px;height:40px;border-radius:12px;background:var(--pr);color:#fff;font-weight:500;font-size:14px}#new:hover{filter:brightness(1.1)}
.srch{position:relative;display:block}.srch svg{position:absolute;left:12px;top:10px;color:var(--mu)}
#q{width:100%;height:36px;padding:0 12px 0 36px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:inherit;font:inherit;font-size:14px;outline:0}#q:focus{border-color:var(--pr)}
#list{flex:1;min-height:0;overflow-y:auto;padding:12px 8px 8px}
#list h3{font-size:12px;font-weight:500;color:var(--mu);padding:0 12px 4px;margin-top:12px}
.ci{display:flex;align-items:center;border-radius:10px}.ci:hover,.ci.on{background:var(--s2)}
.ci .t{flex:1;min-width:0;text-align:left;padding:8px 12px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ci .t svg{display:inline;width:12px;height:12px;margin-right:6px;color:var(--ps)}
.ia{display:flex;align-items:center;gap:2px;padding-right:6px;opacity:0;font-size:12px;color:var(--mu)}.ci:hover .ia,.ci.on .ia,.ci:focus-within .ia{opacity:1}
.ia button{width:28px;height:28px;display:grid;place-items:center;border-radius:6px;color:var(--mu)}.ia button:hover{background:var(--bg);color:var(--fg)}
.rn{flex:1;margin:4px;padding:6px 8px;border-radius:8px;border:1px solid var(--pr);background:var(--bg);color:inherit;font:inherit;font-size:14px;outline:0}
.none{padding:24px 12px;text-align:center;color:var(--mu);font-size:14px}
.foot{display:flex;align-items:center;gap:6px;padding:12px;border-top:1px solid var(--ln)}.foot div{flex:1;min-width:0;line-height:1.3;margin-left:4px}.foot b{display:block;font-size:14px;font-weight:500}.foot small{color:var(--mu);font-size:12px}
.me{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--pr),var(--ps));color:#fff;display:grid;place-items:center;font-weight:600;flex:none}
.ib{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--mu)}.ib:hover{background:var(--s2);color:var(--fg)}
header{display:flex;align-items:center;gap:8px;height:56px;padding:0 12px;border-bottom:1px solid color-mix(in srgb,var(--ln) 60%,transparent);flex:none}
h1{flex:1;min-width:0;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:12px;color:var(--mu);border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:3px 10px;white-space:nowrap}
#scroll{flex:1;min-height:0;overflow-y:auto}
#empty{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px;text-align:center}
.hero{position:relative}.glow{position:absolute;inset:-40px;border-radius:50%;background:conic-gradient(from 180deg,color-mix(in srgb,var(--pr) 45%,transparent),color-mix(in srgb,var(--ps) 30%,transparent),#22d3ee40,color-mix(in srgb,var(--pr) 45%,transparent));filter:blur(40px);animation:g 5s ease-in-out infinite}@keyframes g{50%{opacity:.55;transform:scale(1.08)}}
.big{position:relative;width:88px;height:88px}
#empty h2{margin-top:32px;font-size:28px;letter-spacing:-.02em;font-weight:600}#empty p{margin-top:8px;color:var(--mu);font-size:14px;max-width:420px}
.cards{display:grid;gap:12px;width:100%;max-width:640px;margin-top:28px}@media(min-width:640px){.cards{grid-template-columns:1fr 1fr}}
.cards button{text-align:left;padding:16px;border:1px solid var(--ln);border-radius:14px;background:var(--sf);display:grid;gap:6px}.cards button:hover{border-color:color-mix(in srgb,var(--pr) 60%,transparent);background:var(--s2)}
.cards b{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}.cards b svg{color:var(--ps)}.cards span{font-size:14px;color:var(--mu);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#msgs{max-width:768px;margin:0 auto;padding:24px 16px;display:flex;flex-direction:column;gap:24px}
.m.user{display:flex;flex-direction:column;align-items:flex-end}
.bub{max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--s2);border:1px solid var(--ln);border-radius:18px 18px 4px 18px;padding:10px 16px}
.m.assistant{display:flex;gap:12px}.av{width:28px;height:28px;border-radius:8px;background:#000;flex:none;margin-top:2px;box-shadow:0 0 0 1px #ffffff1a}
.col{min-width:0;flex:1}.body{overflow-wrap:anywhere}.bad{border:1px solid color-mix(in srgb,var(--dg) 45%,transparent);background:color-mix(in srgb,var(--dg) 10%,transparent);color:var(--dg);padding:10px 14px;border-radius:12px;font-size:14px}
.act{display:flex;align-items:center;gap:2px;margin-top:4px;color:var(--mu);font-size:12px;min-height:32px}
.act button{width:32px;height:32px;display:grid;place-items:center;border-radius:8px}.act button:hover{background:var(--s2);color:var(--fg)}.act .on{color:var(--ps)}.act time{padding:0 6px}
@media(hover:hover){.act{opacity:0;transition:opacity .15s}.m:hover .act,.m:focus-within .act{opacity:1}}
.think{display:flex;align-items:center;gap:6px;color:var(--mu);font-size:14px;padding:6px 0}.think i{width:6px;height:6px;border-radius:50%;background:var(--ps);animation:d 1.2s infinite}.think i:nth-child(2){animation-delay:.16s}.think i:nth-child(3){animation-delay:.32s}.think span{margin-left:4px}
@keyframes d{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.body p{margin:12px 0}.body>:first-child{margin-top:0}.body>:last-child{margin-bottom:0}
.body h1,.body h2,.body h3{margin:22px 0 8px;font-weight:600;letter-spacing:-.01em;line-height:1.3}.body h1{font-size:20px}.body h2{font-size:18px}.body h3{font-size:16px}
.body ul,.body ol{margin:12px 0;padding-left:24px}.body li{margin:3px 0}.body a{color:var(--ps)}
.body blockquote{margin:12px 0;padding-left:14px;border-left:2px solid var(--ln);color:var(--mu)}
.body :not(pre)>code{background:var(--s2);padding:2px 6px;border-radius:6px;font:13px 'JetBrains Mono',ui-monospace,monospace}
.tw{margin:14px 0;overflow-x:auto;border:1px solid var(--ln);border-radius:10px}.body table{border-collapse:collapse;width:100%;font-size:14px}.body th{background:var(--s2);text-align:left}.body th,.body td{padding:8px 12px}.body td{border-top:1px solid var(--ln)}
.body hr{border:0;border-top:1px solid var(--ln);margin:20px 0}
.code{margin:14px 0;border:1px solid #ffffff1a;border-radius:12px;background:#0d1117;overflow:hidden}
.ch{display:flex;justify-content:space-between;align-items:center;padding:4px 8px 4px 14px;font:12px 'JetBrains Mono',ui-monospace,monospace;color:#a1a1aa;border-bottom:1px solid #ffffff1a}
.ch button{display:flex;align-items:center;gap:6px;color:#a1a1aa;padding:4px 8px;border-radius:6px;font:inherit}.ch button:hover{background:#ffffff1a;color:#fff}
.code pre{padding:14px;overflow-x:auto;font:13px/1.6 'JetBrains Mono',ui-monospace,monospace;color:#e6edf3}.code code.hljs{background:none;padding:0}
#cw{max-width:768px;width:100%;margin:0 auto;padding:8px 16px max(16px,env(safe-area-inset-bottom));position:relative;flex:none}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:8px;box-shadow:0 8px 24px #0000001a;transition:border-color .15s}.box:focus-within{border-color:color-mix(in srgb,var(--pr) 60%,transparent)}
#ta{display:block;width:100%;resize:none;border:0;outline:0;background:none;color:inherit;font:inherit;font-size:16px;line-height:24px;padding:8px 12px;max-height:220px}#ta::placeholder{color:var(--mu)}
.row{display:flex;align-items:center;justify-content:space-between;padding-top:4px}
#go{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--pr);color:#fff}#go:disabled{opacity:.35;cursor:not-allowed}#go.stop{background:var(--fg);color:var(--bg)}
.mp{position:relative}#mp{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;font-size:12px;color:var(--mu)}#mp:hover{background:var(--s2);color:var(--fg)}#mp i{display:flex}#mp svg{width:14px;height:14px}
#mm{position:absolute;bottom:calc(100% + 8px);left:0;width:280px;max-width:80vw;list-style:none;padding:4px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;box-shadow:0 16px 40px #0004;z-index:30}
#mm button{display:flex;width:100%;text-align:left;padding:8px 12px;border-radius:8px;gap:8px;align-items:center}#mm button:hover{background:var(--s2)}#mm span{flex:1}#mm b{display:block;font-weight:500;font-size:14px}#mm small{display:block;color:var(--mu);font-size:12px}#mm svg{color:var(--ps)}
.fine{text-align:center;font-size:12px;color:var(--mu);margin-top:8px}
#dn{position:absolute;top:-44px;left:50%;transform:translateX(-50%);width:36px;height:36px;border-radius:50%;background:var(--sf);border:1px solid var(--ln);display:grid;place-items:center;color:var(--mu)}
#modal{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:#0009;backdrop-filter:blur(4px)}
.dlg{width:100%;max-width:520px;max-height:90dvh;overflow:auto;background:var(--sf);border:1px solid var(--ln);border-radius:20px 20px 0 0;padding:20px}
@media(min-width:768px){#modal{align-items:center}.dlg{border-radius:20px}}
.dh{display:flex;justify-content:space-between;align-items:center}.dh h2{font-size:18px}
.dlg h4{font-size:14px;font-weight:500;margin:20px 0 6px;display:flex;justify-content:space-between}.hint{font-size:12px;color:var(--mu);margin-bottom:8px}
.dlg textarea{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:inherit;font:inherit;font-size:14px;outline:0;resize:none}.dlg textarea:focus{border-color:var(--pr)}
.dlg input[type=range]{width:100%;accent-color:var(--pr)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}.seg button,.opt{padding:10px;border:1px solid var(--ln);border-radius:10px;font-size:13px;text-align:center}.sel{border-color:var(--pr)!important;background:color-mix(in srgb,var(--pr) 12%,transparent)}
.opt{display:block;width:100%;text-align:left;margin-bottom:6px}.opt b{display:block;font-weight:500;font-size:14px}.opt small{color:var(--mu);font-size:12px}
.seg .dg{color:var(--dg);border-color:color-mix(in srgb,var(--dg) 50%,transparent)}
#toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-90px);background:var(--sf);border:1px solid var(--ln);padding:10px 16px;border-radius:12px;font-size:14px;z-index:90;transition:transform .25s;box-shadow:0 8px 24px #0004;max-width:90vw}#toast.on{transform:translate(-50%,0)}
#att{display:flex;gap:8px;flex-wrap:wrap;padding:4px 4px 8px}
.th{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--ln)}.th img{width:100%;height:100%;object-fit:cover;display:block}
.th button{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#000a;color:#fff;display:grid;place-items:center}.th button svg{width:12px;height:12px}
.lf{display:flex;align-items:center;gap:2px;min-width:0}
#ad{width:32px;height:32px;border-radius:50%;border:1px solid var(--ln);margin-right:4px}
#mp span,#lp span{max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lp{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;font-size:12px;color:var(--mu)}#lp:hover{background:var(--s2);color:var(--fg)}#lp i{display:flex}#lp svg{width:14px;height:14px}
#lm{position:absolute;bottom:calc(100% + 8px);right:0;width:210px;max-height:min(50vh,360px);overflow-y:auto;list-style:none;padding:4px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;box-shadow:0 16px 40px #0004;z-index:30}
#lm button{display:flex;width:100%;text-align:left;padding:9px 12px;border-radius:8px;gap:8px;align-items:center;font-size:14px}#lm button:hover{background:var(--s2)}#lm span{flex:1}#lm svg{color:var(--ps)}
.gal{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:88%;margin-bottom:6px}
.gal img{width:120px;height:120px;object-fit:cover;border-radius:12px;border:1px solid var(--ln);cursor:zoom-in}
#lb{position:fixed;inset:0;z-index:80;background:#000d;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}#lb img{max-width:100%;max-height:100%;border-radius:12px}
body{background:radial-gradient(900px 480px at 85% -8%,color-mix(in srgb,var(--pr) 18%,transparent),transparent 62%),radial-gradient(700px 420px at -8% 108%,color-mix(in srgb,var(--ps) 14%,transparent),transparent 60%),var(--bg);background-attachment:fixed}
#side{background:color-mix(in srgb,var(--sf) 76%,transparent);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5)}
@media(max-width:767px){#side{background:var(--sf)}}
header{position:relative;z-index:5;background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.chip{background:color-mix(in srgb,var(--pr) 10%,var(--sf));border-color:color-mix(in srgb,var(--pr) 30%,var(--ln))}
#new,#go{background:linear-gradient(135deg,#4F46E5,#7C3AED)}
#new{height:42px;border-radius:14px;box-shadow:0 8px 22px color-mix(in srgb,#6366F1 38%,transparent);transition:transform .15s,box-shadow .15s}#new:hover{transform:translateY(-1px);filter:none;box-shadow:0 12px 28px color-mix(in srgb,#6366F1 48%,transparent)}
#go{box-shadow:0 6px 16px color-mix(in srgb,#6366F1 40%,transparent);transition:transform .15s}#go:enabled:hover{transform:scale(1.06)}#go.stop{background:var(--fg);box-shadow:none}
.ci{border-radius:12px}.ci.on{background:color-mix(in srgb,var(--pr) 14%,transparent);box-shadow:inset 3px 0 0 var(--pr)}
.bub{background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff;border:0;border-radius:20px 20px 6px 20px;box-shadow:0 8px 22px color-mix(in srgb,#4F46E5 30%,transparent)}
.av{box-shadow:0 0 0 1px #ffffff1f,0 4px 14px color-mix(in srgb,var(--pr) 35%,transparent)}
.box{border-radius:24px;background:color-mix(in srgb,var(--sf) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 14px 44px #00000030}
.box:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--pr) 24%,transparent),0 14px 44px #00000030}
#empty h2{font-size:30px;background:linear-gradient(135deg,var(--fg) 30%,var(--ps));-webkit-background-clip:text;background-clip:text;color:transparent}
.cards button{border-radius:16px;transition:transform .18s,border-color .18s,box-shadow .18s}.cards button:hover{transform:translateY(-3px);box-shadow:0 14px 30px color-mix(in srgb,var(--pr) 18%,transparent)}
.meter{margin:0 12px 10px;padding:12px;border:1px solid var(--ln);border-radius:16px;background:color-mix(in srgb,var(--pr) 8%,transparent)}
.mt{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--mu)}
#up{padding:5px 12px;border-radius:99px;background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff;font-size:12px;font-weight:500;flex:none}
.bar{height:6px;border-radius:9px;background:var(--ln);margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#22d3ee,#6366f1,#a78bfa);transition:width .4s}.bar.low i{background:linear-gradient(90deg,#f59e0b,#ef4444)}
.badge{padding:4px 12px;border-radius:99px;background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff;font-size:12px;font-weight:600}
.uh{margin-top:14px;font-size:20px;letter-spacing:-.01em}.price{margin:14px 0 4px;font-size:34px;font-weight:600;letter-spacing:-.02em}.price small{font-size:14px;font-weight:400;color:var(--mu)}
.ben{list-style:none;padding:0;display:grid;gap:12px;margin:16px 0}.ben li{display:flex;gap:10px;align-items:flex-start;font-size:14px}.ben svg{color:#22d3ee;margin-top:3px}
.pbtn{width:100%;height:46px;border-radius:14px;background:var(--s2);color:var(--mu);font-weight:500;cursor:not-allowed;border:1px dashed var(--ln)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
<div id="scrim"></div>
<aside id="side">
  <div class="brand"><span class="lg"><img data-logo alt=""></span><b>KIAU AI</b></div>
  <div class="top">
    <button id="new"><i data-i="plus"></i>Chat baru</button>
    <label class="srch"><i data-i="search"></i><input id="q" placeholder="Cari percakapan" aria-label="Cari percakapan"></label>
  </div>
  <nav id="list" aria-label="Riwayat chat"></nav>
  <div class="meter"><div class="mt"><span id="mtx"></span><button id="up">Upgrade</button></div><div class="bar"><i id="mbar"></i></div></div>
  <div class="foot"><span class="me">T</span><div><b>Tamu</b><small>Tersimpan di browser ini</small></div><button id="th" class="ib" aria-label="Ganti tema"></button><button id="st" class="ib" aria-label="Pengaturan"><i data-i="sliders"></i></button></div>
</aside>
<main>
  <header><button id="mn" class="ib" aria-label="Menu"><i data-i="panel"></i></button><h1 id="title">Chat baru</h1><span id="mdl" class="chip"></span></header>
  <div id="scroll">
    <section id="empty">
      <div class="hero"><i class="glow"></i><span class="lg big"><img data-logo alt=""></span></div>
      <h2>Mau mulai dari mana?</h2>
      <p>Tanya apa saja, tempel kode, atau minta draf tulisan. Jawaban mengalir langsung.</p>
      <div class="cards" id="cards"></div>
    </section>
    <div id="msgs" hidden></div>
  </div>
  <footer id="cw">
    <button id="dn" aria-label="Ke pesan terbaru" hidden><i data-i="down"></i></button>
    <div class="box">
      <div id="att" hidden></div>
      <textarea id="ta" rows="1" maxlength="12000" placeholder="Tulis pesan untuk KIAU…" aria-label="Pesan"></textarea>
      <div class="row"><div class="lf"><button id="ad" class="ib" aria-label="Tambah gambar"><i data-i="plus"></i></button><div class="mp"><button id="mp" aria-haspopup="listbox"><span></span><i data-i="chev"></i></button><ul id="mm" role="listbox" hidden></ul></div><div class="mp"><button id="lp" aria-haspopup="listbox" aria-label="Bahasa balasan"><i data-i="globe"></i><span></span></button><ul id="lm" role="listbox" hidden></ul></div></div><button id="go"></button></div>
    </div>
    <p class="fine">KIAU AI bisa keliru. Periksa kembali informasi penting.</p>
  </footer>
</main>
</div>
<input id="fi" type="file" accept="image/*" multiple hidden>

 const last=c.msgs[c.msgs.length-1]===m;
 if(m.r==='user'){
  const lu=[...c.msgs].reverse().find(x=>x.r==='user')===m;
  e.innerHTML=`<div class="bub"></div><div class="act"><time>${hm(m.ts)}</time><button data-a="cp" aria-label="Salin pesan">${ic('copy')}</button>${lu&&!busy?`<button data-a="ed" aria-label="Edit pesan">${ic('pencil')}</button>`:''}</div>`;
  if(m.imgs&&m.imgs.length){const gl=document.createElement('div');gl.className='gal';
   m.imgs.forEach(i=>{const im=document.createElement('img');im.src=i.t;im.alt='Gambar terlampir';
    im.onclick=()=>{const lb=$('#lb'),x=document.createElement('img');x.src=i.f||i.t;lb.replaceChildren(x);lb.hidden=false};gl.append(im)});e.prepend(gl)}
  const bb=e.querySelector('.bub');if(m.c)bb.textContent=m.c;else bb.remove()}
 else{e.innerHTML=`<img class="av" src="${LOGO}" alt=""><div class="col"><div class="body"></div><div class="act"></div></div>`;body(m,e,true);acts(m,e,last)}
 return e}

const stick=()=>{sc.scrollTop=sc.scrollHeight};
const updateDn=()=>{$('#dn').hidden=atBottom||$('#msgs').hidden};
function labels(){const c=cur(),n=ml(c?c.model:S.s.model);$('#mdl').textContent=n;$('#mp span').textContent=n;$('#lp span').textContent=(LANGS.find(x=>x.c===S.s.lang)||LANGS[0]).l;$('#title').textContent=c?c.title:'Chat baru'}
function updateGo(){const g=$('#go');g.className=busy?'stop':'';g.innerHTML=ic(busy?'stop':'up');g.disabled=!busy&&!ta.value.trim()&&!att.length;g.setAttribute('aria-label',busy?'Hentikan jawaban':'Kirim pesan')}
function size(){ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,220)+'px'}
function renderChat(){
 const c=cur(),has=!!(c&&c.msgs.length);labels();
 $('#empty').hidden=has;$('#msgs').hidden=!has;
 $('#msgs').replaceChildren(...(has?c.msgs.map(m=>msgEl(m,c)):[]));
 if(atBottom)requestAnimationFrame(stick);updateDn()}
const item=c=>`<div class="ci${c.id===S.active?' on':''}" data-id="${c.id}"><button class="t" data-a="open">${c.pin?ic('pin'):''}${esc(c.title)}</button><span class="ia"><button data-a="pin" aria-label="Sematkan">${ic('pin')}</button><button data-a="ren" aria-label="Ganti nama">${ic('pencil')}</button><button data-a="del" aria-label="Hapus">${ic('trash')}</button></span></div>`;
function renderSide(){
 const q=$('#q').value.trim().toLowerCase();
 const l=S.chats.filter(c=>!q||c.title.toLowerCase().includes(q)||c.msgs.some(m=>m.c.toLowerCase().includes(q))).sort((a,b)=>b.ts-a.ts);
 const g=(t,a)=>a.length?`<h3>${t}</h3>`+a.map(item).join(''):'';
 $('#list').innerHTML=l.length?g('Disematkan',l.filter(c=>c.pin))+g('Terbaru',l.filter(c=>!c.pin)):`<p class="none">${q?'Tidak ada hasil.':'Belum ada percakapan.'}</p>`}
const view=()=>{renderSide();renderChat();renderMeter()};
const closeDrawer=()=>app.classList.remove('open');
function toggleSide(){if(mobile())app.classList.toggle('open');else{app.classList.toggle('collapsed');S.collapsed=app.classList.contains('collapsed');save()}}

function shrink(file,max,q){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();
 im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',q))};
 im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('gambar'))};im.src=u})}
function renderAtt(){const a=$('#att');a.hidden=!att.length;
 a.replaceChildren(...att.map((g,i)=>{const d=document.createElement('div');d.className='th';const im=document.createElement('img');im.src=g.t;im.alt='Gambar terlampir';
  const b=document.createElement('button');b.setAttribute('aria-label','Hapus gambar');b.innerHTML=ic('x');b.onclick=()=>{att.splice(i,1);renderAtt();updateGo()};d.append(im,b);return d}))}
async function addFiles(fs){
 fs=fs.filter(f=>f.type.startsWith('image/'));if(!fs.length)return;
 if(att.length+fs.length>4){toast('Maksimal 4 gambar per pesan');fs=fs.slice(0,4-att.length)}
 for(const f of fs){
  if(f.size>20*1048576){toast('Gambar terlalu besar (maks 20 MB)');continue}
  try{let g=await shrink(f,1600,.85);if(g.length>8e5)g=await shrink(f,1280,.78);if(g.length>8e5)g=await shrink(f,1000,.7);att.push({t:await shrink(f,256,.55),f:g})}
  catch{toast('Format gambar tidak didukung. Coba foto JPG atau PNG.')}}
 renderAtt();updateGo()}
function apiMsgs(c,ai){
 const a=c.msgs.filter(m=>m!==ai&&!m.err&&((m.r==='assistant'?clean(m.c):m.c).trim()||(m.imgs&&m.imgs.length)));
 let li=-1;a.forEach((m,i)=>{if(m.r==='user'&&m.imgs&&m.imgs.length)li=i});
 const out=a.map((m,i)=>{const tx=m.r==='assistant'?clean(m.c):m.c;
  if(i===li)return{role:'user',content:[{type:'text',text:tx||'Jelaskan gambar ini.'},...m.imgs.map(g=>({type:'image_url',image_url:{url:g.f||g.t}}))]};
  return{role:m.r,content:tx+(m.imgs&&m.imgs.length?' [gambar terlampir sebelumnya]':'')}});
 return{out,vis:li>-1}}
const LIMIT=50;
function dayKey(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function used(){const k=dayKey();if(!S.u||S.u.day!==k)S.u={day:k,n:0};return S.u.n}
const isPrem=()=>S.pu>Date.now();
function renderMeter(){const p=isPrem(),left=Math.max(0,LIMIT-used());
 $('#mtx').textContent=p?'Premium aktif':`Sisa ${left} dari ${LIMIT} pesan hari ini`;
 $('#mbar').style.width=(p?100:left/LIMIT*100)+'%';
 $('.bar').classList.toggle('low',!p&&left<=10);$('#up').hidden=p}
function gate(){if(isPrem())return true;if(used()>=LIMIT){openUpgrade(true);return false}S.u.n++;save();renderMeter();return true}
function openUpgrade(hit){const m=$('#modal');closeDrawer();m.hidden=false;
 m.innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-label="Premium">
 <div class="dh"><span class="badge">Premium</span><button class="ib" data-x aria-label="Tutup">${ic('x')}</button></div>
 <h2 class="uh">${hit?`Batas ${LIMIT} pesan hari ini sudah tercapai`:'Tingkatkan ke Premium'}</h2>
 <p class="hint">${hit?'Batas gratis direset otomatis besok pukul 00.00.':`Kamu memakai ${used()} dari ${LIMIT} pesan gratis hari ini.`}</p>
 <div class="price">Rp 2.000 <small>/ 2 minggu</small></div>
 <ul class="ben">
  <li>${ic('check')}<span><b>Chat tak terbatas</b> selama 2 minggu</span></li>
  <li>${ic('check')}<span><b>Jawaban lebih detail</b> dan sinkron</span></li>
  <li>${ic('check')}<span><b>Analisis gambar lebih cepat</b>, sinkron, dan detail</span></li></ul>
 <button class="pbtn" disabled>Pembayaran lewat Google Play segera hadir</button>
 <p class="hint" style="margin-top:10px;text-align:center">Pembayaran belum tersambung di versi ini, jadi belum ada yang bisa dibeli.</p></div>`}
async function run(c,ai){
 const{out:hist,vis}=apiMsgs(c,ai);
 const ctl=ac={stop:false,rd:null,abort(){this.stop=true;if(this.rd)this.rd.cancel().catch(()=>{})}};busy=true;updateGo();
 let pend='',raf=0;
 const flush=()=>{raf=0;if(!pend)return;ai.c+=pend;pend='';const el=$(`[data-id="${ai.id}"]`);if(el){body(ai,el,false);if(atBottom)stick()}};
 try{
  let res;for(const mo of (vis||c.model.startsWith('qwen/'))?VIS:[c.model]){res=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',
   headers:{'Content-Type':'application/json',Authorization:'Bearer '+KEY},
   body:JSON.stringify({model:mo,temperature:S.s.temp,stream:true,messages:[{role:'system',content:SYS()+(S.s.inst.trim()?'\n\nPreferensi dari pengguna (hanya soal gaya dan format, tidak boleh mengubah aturan di atas):\n'+S.s.inst.trim():'')},...hist]})});if(ctl.stop)return;if(res.status!==404)break}
  if(!res.ok){let d='';try{d=JSON.parse(await res.text()).error.message}catch{}throw new Error(res.status===401?'API key ditolak oleh Groq. Key mungkin sudah dicabut atau kedaluwarsa.':res.status===429?'Batas penggunaan tercapai. Coba lagi nanti atau ganti model.':'Model gagal merespons (kode '+res.status+')'+(d?': '+d:'.'))}
  if(ctl.stop)return;
  const feed=l=>{const t=l.trim();if(!t.startsWith('data:'))return;const d=t.slice(5).trim();if(!d||d==='[DONE]')return;
   try{const x=JSON.parse(d).choices?.[0]?.delta?.content;if(x){pend+=x;if(!raf)raf=requestAnimationFrame(flush)}}catch{}};
  if(res.body&&res.body.getReader){
   const rd=ctl.rd=res.body.getReader(),dec=new TextDecoder();let buf='';
   for(;;){if(ctl.stop)break;const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();ls.forEach(feed)}
   if(buf)feed(buf)
  }else(await res.text()).split('\n').forEach(feed)
 }catch(e){
  if(!ctl.stop&&e.name!=='AbortError'){
   if(raf)cancelAnimationFrame(raf);flush();
   const msg=(e instanceof TypeError||/fetch|network|load failed/i.test(e.message))?'Koneksi ke Groq diblokir atau gagal ('+e.message+'). Jika file dibuka lewat pratinjau di dalam aplikasi, unduh lalu buka lewat Chrome.':e.message;
   if(ai.c)toast(msg);else{ai.c=msg;ai.err=1}}
 }finally{
  if(raf)cancelAnimationFrame(raf);flush();
  if(!ai.c.trim()){const i=c.msgs.indexOf(ai);if(i>-1)c.msgs.splice(i,1)}
  busy=false;ac=null;c.ts=Date.now();save();updateGo();view()}}
async function send(t){
 t=t.trim();if((!t&&!att.length)||busy)return;if(!gate())return;
  const c=cur()||newChat();if(!c.msgs.length)c.title=(t||'Gambar').replace(/\s+/g,' ').slice(0,48);
 const ai=mk('assistant');const um=mk('user',t);if(att.length)um.imgs=att.map(g=>({t:g.t,f:g.f}));c.msgs.push(um,ai);c.ts=Date.now();att=[];renderAtt();
 ta.value='';size();atBottom=true;view();run(c,ai)}

function openSettings(){
 const m=$('#modal'),top=m.firstElementChild?m.firstElementChild.scrollTop:0;m.hidden=false;
 const th=[['light','Terang'],['dark','Gelap'],['system','Sistem']];
 m.innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-label="Pengaturan">
 <div class="dh"><h2>Pengaturan</h2><button class="ib" data-x aria-label="Tutup">${ic('x')}</button></div>
 <h4>Tema</h4><div class="seg">${th.map(([k,l])=>`<button data-th="${k}" class="${S.s.theme===k?'sel':''}">${l}</button>`).join('')}</div>
 <h4>Model bawaan</h4><p class="hint">Dipakai untuk chat baru. Tiap chat bisa ganti model sendiri.</p>
 ${MODELS.map(x=>`<button class="opt ${S.s.model===x.id?'sel':''}" data-sm="${x.id}"><b>${x.l}</b><small>${x.d}</small></button>`).join('')}
 <h4>Kreativitas <span id="tv">${S.s.temp.toFixed(1)}</span></h4><input id="tp" type="range" min="0" max="1.5" step=".1" value="${S.s.temp}" aria-label="Kreativitas">
 <h4>Instruksi kustom</h4><textarea id="si" rows="3" maxlength="2000" placeholder="Contoh: Jawab singkat dan pakai poin-poin.">${esc(S.s.inst)}</textarea>
 <h4>Data</h4><div class="seg"><button data-e="md">Ekspor .md</button><button data-e="json">Ekspor .json</button><button data-e="clr" class="dg">Hapus semua</button></div></div>`;
 m.firstElementChild.scrollTop=top}
function closeSettings(){const m=$('#modal');m.hidden=true;m.innerHTML='';view()}
$('#modal').addEventListener('input',e=>{const t=e.target;
 if(t.id==='tp'){S.s.temp=+t.value;$('#tv').textContent=(+t.value).toFixed(1)}
 if(t.id==='si')S.s.inst=t.value;save()});
$('#modal').addEventListener('click',e=>{const t=e.target,m=$('#modal');
 if(t===m||t.closest('[data-x]'))return closeSettings();
 const th=t.closest('[data-th]');if(th){S.s.theme=th.dataset.th;save();theme();return openSettings()}
 const sm=t.closest('[data-sm]');if(sm){S.s.model=sm.dataset.sm;save();return openSettings()}
 const b=t.closest('[data-e]');if(!b)return;const k=b.dataset.e,c=cur();
 if(k==='md'){if(!c||!c.msgs.length)return toast('Belum ada chat untuk diekspor');
  dl(c.title+'.md','# '+c.title+'\n\n'+c.msgs.map(x=>'**'+(x.r==='user'?'Kamu':'KIAU AI')+'**\n\n'+x.c).join('\n\n---\n\n'),'text/markdown')}
 if(k==='json')dl('kiau-ai-chats.json',JSON.stringify(S.chats,(k,v)=>k==='f'?undefined:v,2),'application/json');
 if(k==='clr'){if(b.dataset.cf){S.chats=[];S.active=null;save();toast('Semua percakapan dihapus');closeSettings()}else{b.dataset.cf=1;b.textContent='Yakin? Klik lagi'}}});

$('#list').onclick=e=>{
 const b=e.target.closest('[data-a]'),row=e.target.closest('.ci');if(!b||!row)return;
 const id=row.dataset.id,c=S.chats.find(x=>x.id===id),a=b.dataset.a;
 if(a==='open'){S.active=id;atBottom=true;closeDrawer();save();view()}
 else if(a==='pin'){c.pin=c.pin?0:1;save();renderSide()}
 else if(a==='ren'){const t=row.querySelector('.t'),i=document.createElement('input');i.value=c.title;i.maxLength=80;i.className='rn';i.setAttribute('aria-label','Nama chat');t.replaceWith(i);i.focus();i.select();
  i.onblur=()=>{const v=i.value.trim();if(v)c.title=v;save();renderSide();labels()};
  i.onkeydown=ev=>{if(ev.key==='Enter')i.blur();if(ev.key==='Escape'){i.value=c.title;i.blur()}}}
 else if(a==='del')row.querySelector('.ia').innerHTML=`<span>Hapus?</span><button data-a="yes" aria-label="Ya, hapus">${ic('check')}</button><button data-a="no" aria-label="Batal">${ic('x')}</button>`;
 else if(a==='yes'){if(busy&&S.active===id&&ac)ac.abort();S.chats=S.chats.filter(x=>x.id!==id);if(S.active===id)S.active=null;save();view()}
 else if(a==='no')renderSide()};
$('#msgs').onclick=e=>{
 const b=e.target.closest('[data-a]'),el=e.target.closest('.m'),c=cur();if(!b||!el||!c)return;
 const a=b.dataset.a,m=c.msgs.find(x=>x.id===el.dataset.id);if(!m)return;
 if(a==='cc')return copy(b.closest('.code').querySelector('pre').innerText.replace(/\n$/,''));
 if(a==='cp')copy(m.c);
 else if(a==='ed'&&!busy){c.msgs.length=c.msgs.indexOf(m);ta.value=m.c;att=(m.imgs||[]).map(g=>({t:g.t,f:g.f||g.t}));renderAtt();save();view();size();updateGo();ta.focus()}
 else if(a==='rg'&&!busy&&gate()){c.msgs.pop();const ai=mk('assistant');c.msgs.push(ai);atBottom=true;view();run(c,ai)}
 else if(a==='up'||a==='dn'){const v=a==='up'?'up':'down';m.fb=m.fb===v?undefined:v;if(m.fb)toast('Terima kasih atas masukanmu');save();acts(m,el,c.msgs[c.msgs.length-1]===m)}};

$('#new').onclick=()=>{newChat();atBottom=true;closeDrawer();save();view();ta.focus()};
$('#q').oninput=renderSide;
$('#mn').onclick=toggleSide;$('#scrim').onclick=closeDrawer;$('#st').onclick=()=>{closeDrawer();openSettings()};
$('#th').onclick=()=>{S.s.theme=document.documentElement.classList.contains('dark')?'light':'dark';save();theme()};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',theme);
$('#cards').onclick=e=>{const b=e.target.closest('[data-p]');if(b)send(PROMPTS[+b.dataset.p].x)};
$('#go').onclick=()=>busy?ac&&ac.abort():send(ta.value);
ta.oninput=()=>{size();updateGo()};
ta.onkeydown=e=>{if(e.key!=='Enter'||e.isComposing)return;const mod=e.ctrlKey||e.metaKey;
 if(!mod&&(e.shiftKey||matchMedia('(pointer:coarse)').matches))return;e.preventDefault();send(ta.value)};
sc.onscroll=()=>{atBottom=sc.scrollHeight-sc.scrollTop-sc.clientHeight<80;updateDn()};
$('#dn').onclick=()=>{atBottom=true;sc.scrollTo({top:sc.scrollHeight,behavior:'smooth'})};
$('#mp').onclick=e=>{e.stopPropagation();$('#lm').hidden=true;const mm=$('#mm'),c=cur(),id=c?c.model:S.s.model;
 mm.innerHTML=MODELS.map(m=>`<li><button data-m="${m.id}"><span><b>${m.l}</b><small>${m.d}</small></span>${m.id===id?ic('check'):''}</button></li>`).join('');mm.hidden=!mm.hidden};
$('#mm').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;const c=cur();if(c)c.model=b.dataset.m;else S.s.model=b.dataset.m;save();$('#mm').hidden=true;labels()};
document.addEventListener('click',e=>{if(!e.target.closest('.mp')){$('#mm').hidden=true;$('#lm').hidden=true}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(!$('#lb').hidden)$('#lb').hidden=true;else if(!$('#modal').hidden)closeSettings();else{closeDrawer();$('#mm').hidden=true;$('#lm').hidden=true}return}
 if(!(e.ctrlKey||e.metaKey))return;const k=e.key.toLowerCase();
 if(k==='b'){e.preventDefault();toggleSide()}
 if(k==='k'){e.preventDefault();if(mobile())app.classList.add('open');else{app.classList.remove('collapsed');S.collapsed=false}setTimeout(()=>$('#q').focus(),80)}});

$('#lp').onclick=e=>{e.stopPropagation();$('#mm').hidden=true;const lm=$('#lm');
 lm.innerHTML=LANGS.map(x=>`<li><button data-l="${x.c}"><span>${x.l}</span>${x.c===S.s.lang?ic('check'):''}</button></li>`).join('');lm.hidden=!lm.hidden};
$('#lm').onclick=e=>{const b=e.target.closest('[data-l]');if(!b)return;S.s.lang=b.dataset.l;save();$('#lm').hidden=true;labels();
 toast(S.s.lang==='auto'?'Bahasa balasan: otomatis':'AI akan membalas dalam bahasa '+b.querySelector('span').textContent)};
$('#ad').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};
ta.addEventListener('paste',e=>{const fs=[...((e.clipboardData&&e.clipboardData.files)||[])];if(fs.some(f=>f.type.startsWith('image/'))){e.preventDefault();addFiles(fs)}});
const bx=$('.box');bx.addEventListener('dragover',e=>e.preventDefault());bx.addEventListener('drop',e=>{e.preventDefault();addFiles([...e.dataTransfer.files])});
$('#lb').onclick=()=>{$('#lb').hidden=true};

$('#up').onclick=()=>openUpgrade(false);
document.querySelectorAll('[data-logo]').forEach(i=>i.src=LOGO);$('#fav').href=LOGO;
document.querySelectorAll('[data-i]').forEach(e=>e.insertAdjacentHTML('afterbegin',ic(e.dataset.i)));
$('#cards').innerHTML=PROMPTS.map((p,i)=>`<button data-p="${i}"><b>${ic(p.i)}${p.t}</b><span>${p.x}</span></button>`).join('');
app.classList.toggle('collapsed',S.collapsed);theme();updateGo();view();
})();
</script>
</body>
